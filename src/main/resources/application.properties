server.port=${SERVER_PORT:8080}
spring.application.name=finance-agent-demo
spring.jackson.time-zone=Asia/Shanghai

langchain4j.open-ai.chat-model.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
langchain4j.open-ai.chat-model.api-key=${DEEPSEEK_API_KEY:}
langchain4j.open-ai.chat-model.model-name=${DEEPSEEK_MODEL:deepseek-chat}
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=false

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/finance_agent_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chat_memory_db}

logging.level.root=info
